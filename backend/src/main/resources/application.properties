# Hotel Booking Portal - Application Configuration (docs/01 section 8)
app.booking.hold-minutes=10
app.expiry.fixed-delay-ms=60000
app.booking.max-candidate-rooms=5
app.inventory.window-days=365
app.inventory.auto-init-on-startup=true
app.booking.max-nights=30
app.booking.zone-id=Asia/Kolkata

# Database settings sourced exclusively from environment variables (D-12, D-17)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

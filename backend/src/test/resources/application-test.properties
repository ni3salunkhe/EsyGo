# Test environment configuration (D-12, D-17)
app.booking.hold-minutes=10
app.expiry.fixed-delay-ms=60000
app.booking.max-candidate-rooms=5
app.inventory.window-days=365
app.inventory.auto-init-on-startup=false
app.booking.max-nights=30
app.booking.zone-id=Asia/Kolkata

spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/hotel_booking_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:12345678}
spring.datasource.hikari.data-source-properties.connectionTimeZone=UTC
spring.datasource.hikari.data-source-properties.forceConnectionTimeZoneToSession=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
